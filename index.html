<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pauline Zoe Tillmann</title>
<meta name="description" content="Portfolio von Pauline Zoe Tillmann." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="landing-view">

<header class="site-chrome chrome-overlay">
  <a href="index.html" class="site-name">Pauline Zoe Tillmann</a>
  <div class="site-chrome-right">
    <a href="https://instagram.com/" target="_blank" rel="noopener" class="icon-link" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="5" />
        <circle cx="12" cy="12" r="4.2" />
        <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none" />
      </svg>
    </a>
    <a href="kontakt.html" class="btn-chrome">Kontakt</a>
    <a href="ueber-mich.html" class="btn-chrome">Über mich</a>
  </div>
</header>

<main class="stage-full">
  <div class="stage-photo-wrap" id="stagePhotoWrap">
    <img id="stagePhoto" src="" alt="" class="stage-photo-full" />
  </div>

  <div class="landing-name" id="landingName">
    <h1>Pauline Zoe Tillmann</h1>
  </div>

  <button class="edge-arrow edge-arrow-left" id="prevArrow" aria-label="Vorheriges Bild">←</button>
  <button class="edge-arrow edge-arrow-right" id="nextArrow" aria-label="Nächstes Bild">→</button>
</main>

<!-- SVG filter for the wave-distortion hover effect -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wave-distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="waveTurb" type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap id="waveDisplace" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<script src="js/script.js"></script>
</body>
</html>
