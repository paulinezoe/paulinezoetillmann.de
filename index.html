<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pauline Zoe Tillmann — Portfolio</title>
<meta name="description" content="Portfolio von Pauline Zoe Tillmann — freie künstlerische Arbeit und Auftragsarbeit in der Filmproduktion." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a href="#main" class="skip-link">Zum Inhalt springen</a>

<header class="topbar">
  <a href="index.html" class="topbar-name">Pauline Zoe Tillmann</a>
  <nav class="topbar-nav">
    <a href="kontakt.html">Kontakt</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram ↗</a>
    <a href="ueber-mich.html">Über mich</a>
  </nav>
</header>

<main class="stage" id="main">
  <div class="stage-frame">
    <div class="stage-image-wrap" id="stageImageWrap">
      <img id="stagePhoto" src="" alt="" class="stage-photo" />
      <div class="stage-click-zone stage-click-prev" aria-hidden="true"></div>
      <div class="stage-click-zone stage-click-next" aria-hidden="true"></div>

      <div class="stage-landing-mark" id="landingMark">
        <h1 class="wordmark">Pauline Zoe Tillmann</h1>
        <p class="landing-hint">Auf das Foto tippen, um durch die Werke zu blättern</p>
      </div>
    </div>

    <div class="stage-caption" id="stageCaption" hidden>
      <p class="stage-index" id="stageIndex"></p>
      <h2 class="stage-title" id="stageTitle"></h2>
      <p class="stage-meta" id="stageMeta"></p>
    </div>

    <div class="stage-controls">
      <button class="stage-arrow" id="prevBtn" aria-label="Vorheriges Werk">←</button>
      <div class="stage-filters" id="stageFilters">
        <button class="stage-filter active" data-filter="all">Alle</button>
        <button class="stage-filter" data-filter="art">Freie Arbeit</button>
        <button class="stage-filter" data-filter="film">Auftragsarbeit</button>
      </div>
      <button class="stage-arrow" id="nextBtn" aria-label="Nächstes Werk">→</button>
    </div>
  </div>
</main>

<!-- SVG filter used for the wave-distortion hover effect on the stage photo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wave-distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="waveTurb" type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap id="waveDisplace" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 Pauline Zoe Tillmann</span>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram ↗</a>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
